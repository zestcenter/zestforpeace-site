<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b3d5c">
<title>ZEST ADMIN</title>
<link rel="manifest" href="/zest-admin-r01pm/manifest.webmanifest">
<link rel="icon" href="/zest-admin-r01pm/adm-192.png">
<link rel="apple-touch-icon" href="/zest-admin-r01pm/adm-192.png">
<style>
html,body{margin:0;height:100%;background:#f3f8fb;font-family:Inter,"Noto Sans Malayalam",system-ui,sans-serif}
.lg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:linear-gradient(160deg,#0b3d5c,#1380b8 70%,#3fa7d6);color:#fff;text-align:center}
.lg img{width:78px;height:78px;border-radius:22px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.lg h1{margin:16px 0 4px;font:900 22px Inter,sans-serif;letter-spacing:.04em}.lg h1 span{color:#ffc44d}
.lg p{margin:0 0 22px;font:600 13px "Noto Sans Malayalam",sans-serif;color:#cfe6f5}
.pin{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.pin input{width:42px;height:52px;border-radius:12px;border:0;text-align:center;font:800 22px Inter,sans-serif;color:#0b3d5c;outline:none;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.pin input:focus{box-shadow:0 0 0 3px #ffc44d}
.go{border:0;border-radius:999px;padding:13px 34px;background:linear-gradient(135deg,#ffc44d,#f0a500);color:#3a2a00;font:800 15px "Noto Sans Malayalam",Inter,sans-serif;box-shadow:0 8px 18px rgba(0,0,0,.2);cursor:pointer}
.go:disabled{opacity:.6}
.er{min-height:20px;margin-top:12px;font:700 12.5px "Noto Sans Malayalam",sans-serif;color:#ffd6dc}
.sm{margin-top:26px;font:600 11px "Noto Sans Malayalam",sans-serif;color:#9fc7de}
.ld{display:flex;align-items:center;justify-content:center;height:100%;color:#0b3d5c;font:700 14px "Noto Sans Malayalam",sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var API = "https://lauftdyrlnhbimqokgye.supabase.co/functions/v1/zest-admin", K = "zestAdminTok";
  function get() { try { return localStorage.getItem(K) || ""; } catch (e) { return ""; } }
  function ok(t) { var e = +String(t).split(".")[0]; return e && e > Date.now(); }
  var root = document.getElementById("root");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});

  function login() {
    root.innerHTML = '<div class="lg"><img src="/zest-admin-r01pm/adm-192.png" alt=""><h1>ZEST <span>ADMIN</span></h1><p>🔒 അഡ്മിൻമാർക്ക് മാത്രം</p>' +
      '<div class="pin">' + [0, 1, 2, 3, 4, 5].map(function () { return '<input inputmode="numeric" maxlength="1" type="password" autocomplete="off">'; }).join("") + '</div>' +
      '<button class="go" type="button">പ്രവേശിക്കുക</button><div class="er"></div><div class="sm">6 അക്ക അഡ്മിൻ PIN നൽകൂ</div></div>';
    var ins = [].slice.call(root.querySelectorAll(".pin input")), btn = root.querySelector(".go"), er = root.querySelector(".er");
    ins.forEach(function (i, n) {
      i.addEventListener("input", function () { i.value = i.value.replace(/\D/g, "").slice(-1); if (i.value && ins[n + 1]) ins[n + 1].focus(); if (ins.every(function (x) { return x.value; })) send(); });
      i.addEventListener("keydown", function (e) { if (e.key === "Backspace" && !i.value && ins[n - 1]) ins[n - 1].focus(); });
    });
    ins[0].focus();
    btn.onclick = send;
    function send() {
      var pin = ins.map(function (x) { return x.value; }).join("");
      if (pin.length < 6) { er.textContent = "6 അക്കങ്ങളും നൽകൂ"; return; }
      btn.disabled = true; er.textContent = "";
      fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "login", pin: pin }) })
        .then(function (r) { return r.json().then(function (j) { return [r.status, j]; }); })
        .then(function (x) {
          btn.disabled = false;
          if (x[1].token) { try { localStorage.setItem(K, x[1].token); if (!localStorage.getItem("zestAuth")) localStorage.setItem("zestAuth", "ZEST Admin"); } catch (e) {} boot(); return; }
          er.textContent = x[0] === 429 ? "പല തവണ തെറ്റി. 15 മിനിറ്റ് കഴിഞ്ഞ് ശ്രമിക്കൂ" : "PIN തെറ്റാണ്";
          ins.forEach(function (i) { i.value = ""; }); ins[0].focus();
        })
        .catch(function () { btn.disabled = false; er.textContent = "ഇന്റർനെറ്റ് കണക്ഷൻ പരിശോധിക്കൂ"; });
    }
  }

  function boot() {
    root.innerHTML = '<div class="ld">ലോഡ് ചെയ്യുന്നു…</div>';
    fetch("/", { cache: "no-cache" }).then(function (r) { return r.text(); }).then(function (h) {
      h = h.replace('href="/manifest.webmanifest"', 'href="/zest-admin-r01pm/manifest.webmanifest"')
           .replace(/<title>[^<]*<\/title>/, "<title>ZEST ADMIN</title>")
           .replace("</head>", '<meta name="robots" content="noindex, nofollow"><script src="/admin.js?v=1" defer><\/script></head>');
      document.open(); document.write(h); document.close();
    }).catch(function () { root.innerHTML = '<div class="ld">ഇന്റർനെറ്റ് കണക്ഷൻ പരിശോധിക്കൂ</div>'; });
  }

  if (ok(get())) boot(); else login();
})();
</script>
</body>
</html>
