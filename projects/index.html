<script>
var D=[{"id":"p-ideal-b6b16172c2","slug":"ideal","e":"🎓","tml":"വിദ്യാഭ്യാസം","ten":"Education","c":"#6a4ee0","ml":["ഐഡിയൽ സ്റ്റുഡന്റ്സ് ബാച്ച്","ZEST-ന്റെ സ്വപ്ന പദ്ധതിയാണ് ഐഡിയൽ സ്റ്റുഡന്റ്സ് ബാച്ച്. സ്കൂൾ പഠനത്തോടൊപ്പം കുട്ടികളിലെ വ്യത്യസ്ത അഭിരുചികൾ കണ്ടെത്തി വളർത്തി, SSLC വിജയത്തിലേക്കും മികച്ച ഭാവിയിലേക്കും അവരെ എത്തിക്കുകയാണ് ലക്ഷ്യം.",["ഓരോ ബാച്ചിലും പ്രദേശത്തെ ആറാം ക്ലാസിൽ പഠിക്കുന്ന 40-ൽ പരം വിദ്യാർത്ഥികൾ","നിലവിൽ 4 ബാച്ചുകൾ","നിശ്ചിത ദിവസങ്ങളിലും സമയങ്ങളിലും, പത്താം ക്ലാസ് വരെ തുടർച്ചയായി 5 വർഷം","പാഠ്യ – പാഠ്യേതര രംഗങ്ങളിൽ മികച്ച പരിശീലനം","പഠന യാത്രകൾ, സ്ഥാപന സന്ദർശനങ്ങൾ, സഹവാസ ക്യാമ്പുകൾ","പ്രമുഖരുമൊത്തുള്ള സഹവാസങ്ങൾ","നീന്തൽ, സൈക്ലിംഗ്, വ്യായാമ മുറകൾ, കായിക പരിശീലനം","സർഗ്ഗസിദ്ധി വളർത്താനുള്ള പരിശീലനങ്ങൾ"]],"en":["Ideal Students Batch","Ideal Students Batch is ZEST's dream project. Alongside school studies, it discovers and nurtures each child's talents and guides them to SSLC success and a bright future.",["Each batch has 40+ students studying in Class 6 from the locality","Currently 4 batches","On fixed days and times, continuously for 5 years up to Class 10","Quality training in academic and co-curricular areas","Study tours, institution visits and residential camps","Interactions with eminent personalities","Swimming, cycling, exercises and sports training","Training to develop creative talents"]]},{"id":"p-service-595606df0e","slug":"service","e":"🛎️","tml":"സേവനം","ten":"Service","c":"#1380b8","ml":["സർവീസ് സെന്റർ","നാട്ടുകാരിൽ ആർക്കും അവരുടെ വ്യത്യസ്ത ആവശ്യങ്ങൾക്ക് ഉപാധികളില്ലാതെ ബന്ധപ്പെടാവുന്ന, വ്യക്തവും സുതാര്യവുമായ കേന്ദ്രമാണ് ZEST സർവീസ് സെന്റർ. ZEST പരിധിയിലെ ആർക്കും ഈ സേവനങ്ങൾ ലഭ്യമാണ്.",["എല്ലാവിധ ഓൺലൈൻ സേവനങ്ങളും","വിദ്യാഭ്യാസ കോഴ്സുകൾ, അപേക്ഷാ രീതികൾ, മാനദണ്ഡങ്ങൾ","സ്കോളർഷിപ്പുകളെക്കുറിച്ചുള്ള വിവരങ്ങളും സഹായവും","തൊഴിൽ അറിയിപ്പുകളും അവസരങ്ങളും","ആരോഗ്യ മേഖലയിലെ അറിയിപ്പുകൾ","സർക്കാർ പദ്ധതികളെക്കുറിച്ചുള്ള വിവരങ്ങളും ഗൈഡൻസും"]],"en":["Service Center","ZEST Service Center is a clear and transparent centre where anyone in the locality c
