<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ZEST Sheet setup</title>
<style>body{font-family:Inter,"Noto Sans Malayalam",sans-serif;background:#f3f8fc;color:#0b2a3d;margin:0;padding:28px 18px;text-align:center}
h1{font-size:20px;margin:0 0 8px}p{font-size:14px;color:#5d707c;line-height:1.6}
button{margin-top:18px;border:0;border-radius:999px;padding:14px 28px;background:linear-gradient(135deg,#1e90cf,#0b5d8f);color:#fff;font-size:16px;font-weight:800}
button:disabled{opacity:.5}ul{list-style:none;padding:0;margin:20px auto;max-width:320px;text-align:left}li{background:#fff;border-radius:12px;padding:10px 14px;margin:6px 0;font-size:14px}</style></head>
<body>
<h1>ZEST FORMS – Sheet പേജുകൾ</h1>
<p>ബട്ടൺ ഞെക്കിയാൽ Sheet-ൽ എല്ലാ പേജുകളും ഡമ്മി വിവരങ്ങളോടെ ഉണ്ടാകും.<br>ഒറ്റ തവണ മാത്രം ഞെക്കുക.</p>
<button id="go">പേജുകൾ ഉണ്ടാക്കുക</button>
<ul id="ls"></ul>
<script>
var U = "https://script.google.com/macros/s/AKfycbyK73G8Mydnrxb4aGWxf1xRfEPHMXEuzoLbtSnMaquZWvnM7kyw0Eh8vWu1Srzes8pO/exec";
var D = "DUMMY";
var F = [
  ["join", { Name: D, House: D, Age: "0", Class: D, WhatsApp: "0000000000", Club: D, Comments: D }],
  ["register", { Name: D, House: D, Age: "0", Class: D, WhatsApp: "0000000000", Club: D, Comments: D }],
  ["suggestion", { Name: D, House: D, Mobile: "0000000000", Section: D, Message: D }],
  ["library", { Name: D, House: D, Mobile: "0000000000", Section: D, Message: D }],
  ["pravasi", { Name: D, House: D, Mobile: "0000000000", Section: D, Message: D }],
  ["challenge", { Name: D, House: D, Mobile: "0000000000", Section: D, Message: D }],
  ["blood_need", { Name: D, House: D, Place: D, Mobile: "0000000000", Group: D, Units: "0", Date: D, Hospital: D }],
  ["blood_donor", { Name: D, House: D, Mobile: "0000000000", Group: D, Place: D, LastDonation: D }],
  ["equipment", { Type: D, Equipment: D, Name: D, House: D, Place: D, Mobile: "0000000000", Date: D, Days: "0", How: D }],
  ["driver", { Type: D, Name: D, House: D, Mobile: "0000000000", Hospital: D, DateTime: D, Pickup: D, Vehicle: D, Days: D, Time: D }]
];
document.getElementById("go").onclick = function () {
  var b = this, ls = document.getElementById("ls"); b.disabled = true; var i = 0;
  (function next() {
    if (i >= F.length) { b.textContent = "✅ കഴിഞ്ഞു – Sheet തുറന്ന് നോക്കൂ"; return; }
    var f = F[i++], p = new URLSearchParams(); p.append("form", f[0]); for (var k in f[1]) p.append(k, f[1][k]);
    var li = document.createElement("li"); li.textContent = "⏳ " + f[0]; ls.appendChild(li);
    fetch(U, { method: "POST", mode: "no-cors", body: p }).then(function () { li.textContent = "✅ " + f[0]; }).catch(function () { li.textContent = "❌ " + f[0]; }).then(function () { setTimeout(next, 1500); });
  })();
};
</script>
</body></html>
